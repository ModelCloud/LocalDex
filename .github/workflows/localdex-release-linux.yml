name: LocalDex Linux release

on:
  push:
    tags:
      - "localdex-v*.*.*"

permissions:
  contents: write

concurrency:
  group: localdex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish LocalDex Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Install native build tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang mold libssl-dev pkg-config
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#localdex-v}"
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$version" == "$cargo_version" ]] || {
            echo "Release tag version $version does not match workspace $cargo_version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the LocalDex package
        env:
          LOCALDEX_PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          LOCALDEX_DIST_DIR: dist/localdex
        run: scripts/build_localdex_linux_amd64.sh
      - name: Create checksums and stage installer
        run: |
          set -euo pipefail
          cp scripts/install/install-localdex.sh dist/localdex/install-localdex.sh
          archive="dist/localdex/localdex-package-x86_64-unknown-linux-gnu.tar.gz"
          built="dist/localdex/localdex-${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
          cp "$built" "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="localdex-v${RELEASE_VERSION}"
          gh release create "$tag" \
            "dist/localdex/localdex-package-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/localdex/localdex-package-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            "dist/localdex/install-localdex.sh" \
            --title "LocalDex ${RELEASE_VERSION}" \
            --notes "LocalDex Codex-compatible CLI for Linux x86_64. The archive includes the CLI and codex-code-mode-host companion." \
            --verify-tag
